2"},{"idx":5,"group":"light","rev":21721,"n":260,"label":"2024 Q2"},{"idx":5,"group":"subst","rev":9708,"n":163,"label":"2024 Q2"},{"idx":6,"group":"noai","rev":27702,"n":1069,"label":"2024 Q3"},{"idx":6,"group":"light","rev":17164,"n":239,"label":"2024 Q3"},{"idx":6,"group":"subst","rev":9603,"n":206,"label":"2024 Q3"},{"idx":7,"group":"noai","rev":22520,"n":1168,"label":"2024 Q4"},{"idx":7,"group":"light","rev":22176,"n":237,"label":"2024 Q4"},{"idx":7,"group":"subst","rev":14380,"n":303,"label":"2024 Q4"},{"idx":8,"group":"noai","rev":24918,"n":921,"label":"2025 Q1"},{"idx":8,"group":"light","rev":20357,"n":225,"label":"2025 Q1"},{"idx":8,"group":"subst","rev":18926,"n":328,"label":"2025 Q1"},{"idx":9,"group":"noai","rev":19998,"n":753,"label":"2025 Q2"},{"idx":9,"group":"light","rev":22109,"n":267,"label":"2025 Q2"},{"idx":9,"group":"subst","rev":11137,"n":388,"label":"2025 Q2"},{"idx":10,"group":"noai","rev":13749,"n":581,"label":"2025 Q3"},{"idx":10,"group":"light","rev":16778,"n":219,"label":"2025 Q3"},{"idx":10,"group":"subst","rev":7730,"n":369,"label":"2025 Q3"},{"idx":11,"group":"noai","rev":15158,"n":324,"label":"2025 Q4"},{"idx":11,"group":"light","rev":16154,"n":161,"label":"2025 Q4"},{"idx":11,"group":"subst","rev":8803,"n":296,"label":"2025 Q4"},{"idx":12,"group":"noai","rev":15524,"n":507,"label":"2026 Q1"},{"idx":12,"group":"light","rev":11590,"n":269,"label":"2026 Q1"},{"idx":12,"group":"subst","rev":11487,"n":452,"label":"2026 Q1"}],"fig3C":[{"genre":"General Romance","scope":"Overall","early":20546,"late":18235,"pct_label":"-11%","pct_change":-11.2,"genre_label":"General Romance","y_pos":6.18},{"genre":"Speculative / Adventure Romance","scope":"Overall","early":15999,"late":11920,"pct_label":"-26%","pct_change":-25.5,"genre_label":"Speculative /\nAdventure Romance","y_pos":1.18},{"genre":"Crime / Suspense Romance","scope":"Overall","early":29360,"late":21982,"pct_label":"-25%","pct_change":-25.1,"genre_label":"Crime / Suspense\nRomance","y_pos": ion / Adventure / Dystopian","scope":"No AI text","early":20699,"late":19826,"pct_label":"-4%","pct_change":-4.2,"genre_label":"Sci-Fi /\nAdventure / Dystopian","y_pos":3.82},{"genre":"General / Contemporary Fiction","scope":"No AI text","early":35349,"late":22052,"pct_label":"-38%","pct_change":-37.6,"genre_label":"General /\nContemporary Fiction","y_pos":4.82}],"genre_order":["Sports Romance","Crime / Suspense Romance","General Romance","General / Contemporary Fiction","Science Fiction / Adventure / Dystopian","Fantasy / Supernatural / Horror","Mystery / Thriller / Crime","Speculative / Adventure Romance"],"n_quarters":13,"n_quarters_b":13,"year_ticks_a":[{"idx":0,"label":"2023"},{"idx":4,"label":"2024"},{"idx":8,"label":"2025"},{"idx":12,"label":"2026"}],"year_ticks_b":[{"idx":0,"label":"2023"},{"idx":4,"label":"2024"},{"idx":8,"label":"2025"},{"idx":12,"label":"2026"}],"max_n_b":1299,"max_rev_b":32832.0};
const SVGNS = 'http://www.w3.org/2000/svg';
// The figure is drawn in its original 1200-unit design grid, then scaled up onto
// a 1400-wide canvas so its rendered scale (and font sizes) match Figures 1 and 2.
const CANVAS_SCALE = 1400 / 1200;
const svg = (function () {
  const rootSvg = document.getElementById('figure');
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('transform', `scale(${CANVAS_SCALE})`);
  rootSvg.appendChild(g);
  return g;
})();
function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function txt(x, y, text, attrs = {}, parent = svg) {
  const t = el('text', { x, y, ...attrs }, parent);
  t.textContent = text;
  return t;
}
const scale = (d0, d1, r0, r1) => (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);

function fmtCurrency(v) {
  if (v === 0) return '$0';
  if (Math.abs(v) >= 1000) return `$${Math.round(v / 1000)}K`;
  return `$${v}`;
}

// =============================================================================
// PANEL A: Calendar-market accounting (top-left)
// =============================================================================
function renderPanelA() {
  // Header (two lines)
  txt(15, 120, 'A.', { class: 'panel-letter' });
  txt(45, 120, 'New books appear far faster than sales or revenue rise', { class: 'panel-title' });
  txt(45, 144, 'Quarterly books, sales, and revenue relative to 2023', { class: 'panel-subtitle' });

  const plotX = 70, plotY = 180, plotW = 345, plotH = 260;
  const g = el('g', { transform: `translate(${plotX},${plotY})` });

  const xS = scale(0, DATA.n_quarters - 1, 0, plotW);
  const yS = scale(0, 40, plotH, 0);
  const yTicks = [0, 10, 20, 30, 40];

  for (const t of yTicks) {
    el('line', { x1: 0, x2: plotW, y1: yS(t), y2: yS(t), stroke: COLORS.gridline, 'stroke-width': 1 }, g);
  }

  for (const t of yTicks) {
    txt(-10, yS(t) + 5, t + '×', { class: 'tick', 'text-anchor': 'end' }, g);
  }
  txt(-50, plotH / 2, 'Multiple of 2023Q1 level', {
    class: 'axis-label', 'text-anchor': 'middle',
    transform: `rotate(-90, -50, ${plotH / 2})`
  }, g);

  el('line', { x1: 0, x2: plotW, y1: plotH, y2: plotH, stroke: COLORS.axis, 'stroke-width': 1 }, g);
  DATA.year_ticks_a.forEach(t => {
    el('line', { x1: xS(t.idx), x2: xS(t.idx), y1: plotH, y2: plotH + 4, stroke: COLORS.axis, 'stroke-width': 1 }, g);
    txt(xS(t.idx), plotH + 22, t.label, { class: 'tick', 'text-anchor': 'middle' }, g);
  });

  // Draw lines
  const points = DATA.fig3A;
  const lines = [
    { key: 'sales',    color: COLORS.sales,    width: 2.4, name: 'Sales' },
    { key: 'revenue',  color: COLORS.revenue,  width: 2.6, name: 'Revenue' },
    { key: 'selling',  color: COLORS.selling,  width: 2.6, name: 'Selling books' },
    { key: 'released', color: COLORS.released, width: 2.8, name: 'Released books (cumulative)' },
  ];
  lines.forEach(L => {
    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xS(p.idx)} ${yS(p[L.key])}`).join(' ');
    el('path', { d: path, fill: 'none', stroke: L.color, 'stroke-width': L.width,
                 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
    points.forEach(p => {
      el('circle', { cx: xS(p.idx), cy: yS(p[L.key]), r: 3.5, fill: L.color, stroke: '#ffffff', 'stroke-width': 1.0 }, g);
    });
  });

  // Direct end labels (right of plot, no bottom legend)
  // Compute label y-positions, handling collision between Revenue and Sales
  const last = points[points.length - 1];
  const labels = [
    { key: 'released', name: 'Released books (cumulative)', val: last.released, color: COLORS.released },
    { key: 'selling',  name: 'Selling books',   val: last.selling,  color: COLORS.selling },
    { key: 'revenue',  name: 'Revenue',         val: last.revenue,  color: COLORS.revenue },
    { key: 'sales',    name: 'Sales',           val: last.sales,    color: COLORS.sales },
  ];
  function drawDirectLabel(x, y, name, val, color, parent) {
    const t = el('text', {
      x,
      y,
      class: 'direct-label',
      fill: color
    }, parent);

    const lines = name === 'Released books (cumulative)'
      ? ['Released books', `(cumulative) ${val.toFixed(1)}×`]
      : [`${name} ${val.toFixed(1)}×`];

    lines.forEach((line, i) => {
      const ts = document.createElementNS(SVGNS, 'tspan');
      ts.setAttribute('x', x);
      if (i > 0) ts.setAttribute('dy', '15');
      ts.textContent = line;
      t.appendChild(ts);
    });
  }
  
  // Native y positions
  labels.forEach(L => { L.dotY = yS(L.val); L.labelY = L.dotY; });
  // Resolve collision: Revenue and Sales are close. Push revenue up, sales down.
  const revLabel = labels.find(l => l.key === 'revenue');
  const salesLabel = labels.find(l => l.key === 'sales');
  if (Math.abs(revLabel.labelY - salesLabel.labelY) < 18) {
    const mid = (revLabel.labelY + salesLabel.labelY) / 2;
    revLabel.labelY = mid - 11;
    salesLabel.labelY = mid + 11;
  }
  const endX = xS(last.idx);
  labels.forEach(L => {
    // Dot at actual endpoint
    el('circle', { cx: endX, cy: L.dotY, r: 3.5, fill: L.color, stroke: '#ffffff', 'stroke-width': 1.2 }, g);
    // Leader line if label offset from dot
    if (Math.abs(L.labelY - L.dotY) > 4) {
      el('line', { x1: endX + 5, x2: endX + 14, y1: L.dotY, y2: L.labelY,
                   stroke: L.color, 'stroke-width': 0.8, opacity: 0.5 }, g);
    }
    drawDirectLabel(
      endX + 18,
      L.key === 'released' ? L.labelY - 4 : L.labelY + 5,
      L.name,
      L.val,
      L.color,
      g
    );
  });
}

// =============================================================================
// PANEL B: 13-week launch revenue by group (top-right)
// =============================================================================
function renderPanelB() {
  // Header (two lines)
  txt(615, 120, 'B.', { class: 'panel-letter' });
  txt(645, 120, 'Books with no AI text still earn the most, but their lead is shrinking', { class: 'panel-title' });
  txt(645, 144, 'Revenue per book in the launch window, by release cohort and AI-text band', { class: 'panel-subtitle' });

  const plotX = 670, plotY = 180, plotW = 490, plotH = 260;
  const g = el('g', { transform: `translate(${plotX},${plotY})` });

  const xS = scale(0, DATA.n_quarters_b - 1, 0, plotW);
  const yMax = 40000;
  const yS = scale(0, yMax, plotH, 0);
  const yTicks = [0, 10000, 20000, 30000, 40000];

  for (const t of yTicks) {
    el('line', { x1: 0, x2: plotW, y1: yS(t), y2: yS(t), stroke: COLORS.gridline, 'stroke-width': 1 }, g);
  }
  for (const t of yTicks) {
    txt(-10, yS(t) + 5, fmtCurrency(t), { class: 'tick', 'text-anchor': 'end' }, g);
  }
  const bAxisLabel = el('text', {
    x: -58,
    y: plotH / 2 - 8,
    class: 'axis-label',
    'text-anchor': 'middle',
    transform: `rotate(-90, -58, ${plotH / 2})`
  }, g);
  let bAxisLine = document.createElementNS(SVGNS, 'tspan');
  bAxisLine.setAttribute('x', -58);
  bAxisLine.textContent = 'Launch-window revenue per book';
  bAxisLabel.appendChild(bAxisLine);
  bAxisLine = document.createElementNS(SVGNS, 'tspan');
  bAxisLine.setAttribute('x', -58);
  bAxisLine.setAttribute('dy', '16');
  bAxisLine.textContent = '(pre-sales + 90 days post-release)';
  bAxisLabel.appendChild(bAxisLine);

  el('line', { x1: 0, x2: plotW, y1: plotH, y2: plotH, stroke: COLORS.axis, 'stroke-width': 1 }, g);
  DATA.year_ticks_b.forEach(t => {
    el('line', { x1: xS(t.idx), x2: xS(t.idx), y1: plotH, y2: plotH + 4, stroke: COLORS.axis, 'stroke-width': 1 }, g);
    txt(xS(t.idx), plotH + 22, t.label, { class: 'tick', 'text-anchor': 'middle' }, g);
  });

  // Marker AREA encodes the cohort count (area linear in log-count), so the disk
  // area — what the eye actually reads — tracks the number of books.
  const maxN = DATA.max_n_b;
  const R_MIN = 2.5, R_MAX = 6.0;
  function pointR(n) {
    if (n <= 0) return R_MIN;
    const t = Math.log(n + 1) / Math.log(maxN + 1);   // 0..1 on a log scale
    return Math.sqrt(R_MIN * R_MIN + t * (R_MAX * R_MAX - R_MIN * R_MIN));
  }

  const groups = ['noai', 'light', 'subst'];
  const colorOf = { noai: COLORS.human, light: COLORS.aiAssisted, subst: COLORS.aiMajority };
  const BAND_DISPLAY = { noai: 'No AI text', light: 'Light AI text (\u226425%)', subst: 'Substantial AI text (>25%)' };

  // Lines + count-sized markers per band
  groups.forEach(grp => {
    const pts = DATA.fig3B.filter(d => d.group === grp).sort((a, b) => a.idx - b.idx);
    if (pts.length === 0) return;
    const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xS(p.idx)} ${yS(p.rev)}`).join(' ');
    el('path', { d: path, fill: 'none', stroke: colorOf[grp], 'stroke-width': 2.2,
                 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: 0.85 }, g);
    pts.forEach(p => {
      el('circle', { cx: xS(p.idx), cy: yS(p.rev), r: pointR(p.n),
        fill: colorOf[grp], stroke: '#ffffff', 'stroke-width': 1.2, opacity: 0.9 }, g);
    });
  });

  // Band legend (no box), top-right corner of the plot, left-aligned as a block
  const legRowH = 15, legLine = 22, legTextGap = 7;
  const legY0 = 6;
  // widest label sets the block width so the whole legend is left-aligned inside a right-anchored box
  const widestLabel = Math.max(...groups.map(grp => BAND_DISPLAY[grp].length)) * 6.6;
  const legBlockW = legLine + legTextGap + widestLabel;
  const legStartX = plotW - legBlockW - 4;             // left edge of the legend block
  groups.forEach((grp, i) => {
    const ry = legY0 + i * legRowH;
    el('line', { x1: legStartX, x2: legStartX + legLine, y1: ry, y2: ry, stroke: colorOf[grp], 'stroke-width': 2.6, 'stroke-linecap': 'round' }, g);
    el('circle', { cx: legStartX + legLine / 2, cy: ry, r: 3.4, fill: colorOf[grp], stroke: '#ffffff', 'stroke-width': 1.2 }, g);
    txt(legStartX + legLine + legTextGap, ry + 4, BAND_DISPLAY[grp], { class: 'legend', 'text-anchor': 'start' }, g);
  });

  // Size legend: reference markers drawn with the same area encoding as the data
  txt(0, plotH + 42, 'Marker area: number of books per cohort (log scale)',
      { class: 'annotation', 'text-anchor': 'start' }, g);
  const legCounts = [50, 300, 1000];
  const legCx = [18, 84, 156];
  const legCy = plotH + 64;
  legCounts.forEach((c, i) => {
    el('circle', { cx: legCx[i], cy: legCy, r: pointR(c), fill: '#aaaaaa', stroke: '#ffffff', 'stroke-width': 1 }, g);
    txt(legCx[i], legCy + R_MAX + 13, c.toLocaleString(), { class: 'tick', 'text-anchor': 'middle' }, g);
  });
}

// =============================================================================
// PANEL C: Overall genre dumbbell (bottom-left)
// =============================================================================
function renderDumbbellPanel(opts) {
  const { headerX, headerY, letter, title, subtitleY, subtitle,
          labelRightX, plotX, plotY, plotW, plotH,
          scope, showLegend } = opts;

  txt(headerX, headerY, letter, { class: 'panel-letter' });
  txt(headerX + 30, headerY, title, { class: 'panel-title' });
  txt(headerX + 30, subtitleY, subtitle, { class: 'panel-subtitle' });

  const rowH = plotH / DATA.genre_order.length;
  const xDomainMax = 50000;
  const xTicks = [0, 10000, 20000, 30000, 40000, 50000];
  const xS = scale(0, xDomainMax, plotX, plotX + plotW);

  // Vertical gridlines
  for (const t of xTicks) {
    el('line', { x1: xS(t), x2: xS(t), y1: plotY, y2: plotY + plotH,
                 stroke: COLORS.gridline, 'stroke-width': 1 });
  }

  // Year encoding legend (top-left inside plot area)
  if (showLegend) {
    const lgY = plotY - 13;
    el('circle', { cx: plotX + 8, cy: lgY, r: 5, fill: COLORS.early, stroke: COLORS.earlyStroke, 'stroke-width': 1.8 });
    txt(plotX + 20, lgY + 5, '2023 cohort', { class: 'legend' });
    el('circle', { cx: plotX + 130, cy: lgY, r: 5, fill: COLORS.late });
    txt(plotX + 142, lgY + 5, '2025 cohort', { class: 'legend' });
  }

  // Dumbbells
  DATA.genre_order.forEach((genre, gi) => {
    const d = DATA.fig3C.find(r => r.genre === genre && r.scope === scope);
    if (!d) return;
    const y = plotY + gi * rowH + rowH / 2;
    const xEarly = xS(d.early);
    const xLate  = xS(d.late);

    // Connector line
    el('line', { x1: xEarly, x2: xLate, y1: y, y2: y,
                 stroke: COLORS.connector, 'stroke-width': 4, 'stroke-linecap': 'round' });
    // Early: open circle (2023)
    el('circle', { cx: xEarly, cy: y, r: 6, fill: COLORS.early, stroke: COLORS.earlyStroke, 'stroke-width': 1.8 });
    // Late: filled circle (2025)
    el('circle', { cx: xLate,  cy: y, r: 6, fill: COLORS.late });

    // Percent label (outside the dumbbell direction)
    const isDecline = d.pct_change < 0;
    const labelOffset = isDecline ? -10 : 10;
    const anchor = isDecline ? 'end' : 'start';
    txt(xLate + labelOffset, y + 5, d.pct_label, {
      class: 'pct-label', fill: COLORS.pctLabel, 'text-anchor': anchor
    });

    // Genre label (multi-line, right-aligned)
    const lines = d.genre_label.split('\n');
    const lh = 15;
    const topY = y - ((lines.length - 1) * lh) / 2 + 4;
    const tEl = el('text', { x: labelRightX, y: topY, class: 'genre-label', 'text-anchor': 'end' });
    lines.forEach((line, li) => {
      const ts = document.createElementNS(SVGNS, 'tspan');
      ts.setAttribute('x', labelRightX);
      if (li > 0) ts.setAttribute('dy', lh);
      ts.textContent = line;
      tEl.appendChild(ts);
    });
  });

  // X-axis baseline + ticks
  el('line', { x1: plotX, x2: plotX + plotW, y1: plotY + plotH, y2: plotY + plotH,
               stroke: COLORS.axis, 'stroke-width': 1 });
  xTicks.forEach(t => {
    el('line', { x1: xS(t), x2: xS(t), y1: plotY + plotH, y2: plotY + plotH + 4,
                 stroke: COLORS.axis, 'stroke-width': 1 });
    txt(xS(t), plotY + plotH + 20, fmtCurrency(t),
        { class: 'tick', 'text-anchor': 'middle' });
  });

  // X-axis title
  txt(plotX + plotW / 2, plotY + plotH + 50, 'Launch-window revenue per book',
      { class: 'axis-label', 'text-anchor': 'middle' });
  txt(plotX + plotW / 2, plotY + plotH + 68, '(pre-sales + 90 days post-release)',
      { class: 'axis-label', 'text-anchor': 'middle' });
}
