const SVGNS = 'http://www.w3.org/2000/svg';
// The figure is drawn in its original 1200-unit design grid, then scaled up onto
// a 1400-wide canvas so its rendered scale (and font sizes) match Figure 1.
const CANVAS_SCALE = 1400 / 1200;
const svg = (function () {
  const rootSvg = document.getElementById('figure');
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('transform', `scale(${CANVAS_SCALE})`);
  rootSvg.appendChild(g);
  return g;
})();
function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function txt(x, y, text, attrs = {}, parent = svg) {
  const t = el('text', { x, y, ...attrs }, parent);
  t.textContent = text;
  return t;
}
const scale = (d0, d1, r0, r1) => (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);

function heatColor(v, vmax) {
  if (v === null || v === undefined) return COLORS.na;
  const t = Math.max(0, Math.min(v / vmax, 1));
  const [r0,g0,b0] = COLORS.heatLow;
  const [r1,g1,b1] = COLORS.heatHigh;
  const r = Math.round(r0 + (r1 - r0) * t);
  const g = Math.round(g0 + (g1 - g0) * t);
  const b = Math.round(b0 + (b1 - b0) * t);
  return `rgb(${r},${g},${b})`;
}

  const substMid = cL['subst'] * 0.36;   // bias below center of orange band so label clears the orange/blue boundary
  const lightMid = cL['subst'] + (cL['light'] - cL['subst']) / 2;
  const noaiMid  = cL['light'] + (cL['noai']  - cL['light'])  / 2;
  const labelX = plotW - 12;
  bandText(labelX, yS(noaiMid)  + 5, 'noai',  { class: 'direct-label', fill: COLORS.human, 'text-anchor': 'end' }, g);
  bandText(labelX, yS(lightMid) + 5, 'light', { class: 'direct-label', fill: '#ffffff', 'text-anchor': 'end' }, g);
  bandText(labelX, yS(substMid) + 5, 'subst', { class: 'direct-label', fill: '#1a1a1a', 'text-anchor': 'end' }, g);
}

// =============================================================================
// PANEL C: Heatmap with horizontal color bar  (bottom-left)
// =============================================================================
const GENRE_ORDER_C = ["Crime/Suspense Rom.", "Sci-Fi/Adventure", "Mystery/Thriller", "Speculative Romance", "General Romance", "Contemporary Fiction", "Fantasy/Horror", "Sports Romance"];

function renderPanelC() {
  txt(15, 560, 'C.', { class: 'panel-letter' });
  txt(45, 560, 'Books with substantial AI text are reaching the top in every genre', { class: 'panel-title' });
  txt(45, 579, "Share of each genre's Top 25 slots held by books with substantial AI text", { class: 'axis-label', fill: COLORS.textMuted });
  const plotX = 205, plotY = 603;
  const heatW = 360, cellW = heatW / DATA.n_quarters_c, cellH = 42;
  const heatH = cellH * GENRE_ORDER_C.length;
  const rowOf = {}; GENRE_ORDER_C.forEach((g, i) => { rowOf[g] = i; });
  const VMAX = 40;
  DATA.fig2C.forEach(c => {
    const gi = rowOf[c.genre]; if (gi === undefined) return;
    const x = plotX + c.qi * cellW, y = plotY + gi * cellH;
    el('rect', { x, y, width: cellW, height: cellH, fill: heatColor(c.val, VMAX), stroke: '#ffffff', 'stroke-width': 2 });
  });
  GENRE_ORDER_C.forEach((genre, gi) => {
    const labelLines = DATA.genre_labels[genre] || [genre];
    const cy = plotY + gi * cellH + cellH / 2, lh = 14;
    const topY = cy - ((labelLines.length - 1) * lh) / 2 + 4;
    const tEl = el('text', { x: plotX - 12, y: topY, class: 'heatmap-row-label', 'text-anchor': 'end' });
    labelLines.forEach((line, li) => {
      const ts = document.createElementNS(SVGNS, 'tspan');
      ts.setAttribute('x', plotX - 12);
      if (li > 0) ts.setAttribute('dy', lh);
      ts.textContent = line; tEl.appendChild(ts);
    });
  });
  // Year labels at the Q1 column of each year (columns 0,4,8,12), centered on that
  // column, matching the Q1 time anchor used by panels A, B, and D. Equal 4-column spacing.
  const yearLabelY = plotY + heatH + 22;
  [['2023', 0], ['2024', 4], ['2025', 8], ['2026', 12]].forEach(([label, col]) => {
    const x = plotX + (col + 0.5) * cellW;
    el('line', { x1: x, x2: x, y1: plotY + heatH, y2: plotY + heatH + 4, stroke: COLORS.axis, 'stroke-width': 1 });
    txt(x, yearLabelY, label, { class: 'tick', 'text-anchor': 'middle' });
  });
  const cbX = plotX, cbY = plotY + heatH + 45, cbW = heatW, cbH = 16;
  el('rect', { x: cbX, y: cbY, width: cbW, height: cbH, fill: 'url(#colorbar-grad)', stroke: '#bbbbbb', 'stroke-width': 0.6 });
  const cbXS = scale(0, VMAX, cbX, cbX + cbW);
  [0, 10, 20, 30, 40].forEach(v => {
    const x = cbXS(v);
    el('line', { x1: x, x2: x, y1: cbY + cbH, y2: cbY + cbH + 4, stroke: '#888', 'stroke-width': 1 });
    txt(x, cbY + cbH + 18, v + '%', { class: 'tick', 'text-anchor': 'middle', 'font-size': 11.143 });
  });
  txt(cbX + cbW / 2, cbY + cbH + 38, 'Books with Substantial AI text (>25%) share of Top 25 slots', { class: 'colorbar-title', 'text-anchor': 'middle' });
}

// =============================================================================
// PANEL D: Top-rank churn lines  (bottom-right)
// =============================================================================
function renderPanelD() {
  txt(615, 560, 'D.', { class: 'panel-letter' });
  txt(645, 560, 'New books with substantial AI text are entering the bestseller lists', { class: 'panel-title' });
  txt(645, 579, 'Each quarter, fewer bestsellers stay on the list and more entrants carry substantial AI text', { class: 'axis-label', fill: COLORS.textMuted });
  const plotX = 670, plotY = 603, plotW = 470, plotH = 336;
  const g = el('g', { transform: `translate(${plotX},${plotY})` });
  const xS = scale(0, DATA.n_quarters_d - 1, 0, plotW);
  const yS = scale(0, 100, plotH, 0);
  const yTicks = [0, 25, 50, 75, 100];
  for (const t of yTicks) el('line', { x1: 0, x2: plotW, y1: yS(t), y2: yS(t), stroke: COLORS.gridline, 'stroke-width': 1 }, g);
  for (const t of yTicks) txt(-8, yS(t) + 5, t + '%', { class: 'tick', 'text-anchor': 'end' }, g);
  txt(-50, plotH / 2, 'Share within Top-25 group', { class: 'axis-label', 'text-anchor': 'middle', transform: `rotate(-90, -50, ${plotH / 2})` }, g);
  el('line', { x1: 0, x2: plotW, y1: plotH, y2: plotH, stroke: COLORS.axis, 'stroke-width': 1 }, g);
  DATA.year_ticks_d.forEach(t => { el('line', { x1: xS(t.idx), x2: xS(t.idx), y1: plotH, y2: plotH + 4, stroke: COLORS.axis, 'stroke-width': 1 }, g); txt(xS(t.idx), plotH + 22, t.label, { class: 'tick', 'text-anchor': 'middle' }, g); });
  const metrics = [
    { name: 'retention', label: 'Bestsellers with no AI text retained from previous quarter', color: COLORS.human },
    { name: 'entrant', label: 'New Top-25 entrants with substantial AI text', color: COLORS.aiMajority },
  ];
  metrics.forEach(m => {
    const pts = DATA.fig2D.filter(d => d.metric === m.name).sort((a, b) => a.idx - b.idx);
    const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xS(p.idx)} ${yS(p.pct)}`).join(' ');
    el('path', { d: path, fill: 'none', stroke: m.color, 'stroke-width': 3.2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  });
  metrics.forEach(m => DATA.fig2D.filter(d => d.metric === m.name).forEach(p => el('circle', { cx: xS(p.idx), cy: yS(p.pct), r: 4.6, fill: m.color, stroke: '#ffffff', 'stroke-width': 1.6 }, g)));
  // Legend (no box) top area
  const legSwatch = 30, legGap = 9, legRowH = 24, legTextW = 268;
  const legLeft = plotW - 4 - (legSwatch + legGap + legTextW), legTop = 10;
  metrics.forEach((m, i) => {
    const ry = legTop + 6 + i * legRowH, sx = legLeft;
    el('line', { x1: sx, x2: sx + legSwatch, y1: ry, y2: ry, stroke: m.color, 'stroke-width': 3.2, 'stroke-linecap': 'round' }, g);
    el('circle', { cx: sx + legSwatch / 2, cy: ry, r: 4.6, fill: m.color, stroke: '#ffffff', 'stroke-width': 1.6 }, g);
    txt(sx + legSwatch + legGap, ry + 5, m.label, { class: 'legend' }, g);
  });
}

renderPanelA();
renderPanelB();
renderPanelC();
renderPanelD();
</script>
