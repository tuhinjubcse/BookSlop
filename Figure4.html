  txt(ox+0,56,'C.',{class:'panel-letter'});
  txt(ox+30,56,'Many authors ramp up output after their first book',{class:'panel-title'});
  txt(ox+30,78,'with substantial AI text',{class:'panel-title'});
  txt(ox+30,98,'Monthly book output per author, before and after',{class:'panel-subtitle'});
  const plotX=ox+70,plotY=120,plotW=330,plotH=300;
  const g=el('g',{transform:`translate(${plotX},${plotY})`});
  const breakValues=[0,0.1,0.25,0.5,1,2,5],domainMax=8,sMax=Math.sqrt(domainMax);
  const sx=v=>(Math.sqrt(v)/sMax)*plotW,sy=v=>plotH-(Math.sqrt(v)/sMax)*plotH;
  for(const v of breakValues){if(v>0){
    el('line',{x1:sx(v),x2:sx(v),y1:0,y2:plotH,stroke:COLORS.gridline,'stroke-width':1},g);
    el('line',{x1:0,x2:plotW,y1:sy(v),y2:sy(v),stroke:COLORS.gridline,'stroke-width':1},g);}}
  el('line',{x1:0,y1:plotH,x2:plotW,y2:0,stroke:COLORS.refLine,'stroke-width':1.5,'stroke-dasharray':'5 4'},g);
  const a=Math.atan2(-plotH,plotW)*180/Math.PI,ls='fill:#7B2D26';
  txt(plotW*0.66,plotH*0.26,'Same output rate as before',{class:'legend',style:ls,'text-anchor':'middle',transform:`rotate(${a},${plotW*0.66},${plotH*0.26})`},g);
  txt(plotW*0.30,plotH*0.22,'Published more after',{class:'legend',style:ls,'font-style':'italic','text-anchor':'middle',transform:`rotate(${a},${plotW*0.30},${plotH*0.22})`},g);
  txt(plotW*0.66,plotH*0.72,'Published less after',{class:'legend',style:ls,'font-style':'italic','text-anchor':'middle',transform:`rotate(${a},${plotW*0.66},${plotH*0.72})`},g);
  const cbt={'existing':COLORS.aiAssisted,'nopre':COLORS.aiMajority};
  const ordered=DATA.fig4C1.slice().sort((x,y)=>x.type===y.type?x.ai-y.ai:(x.type==='existing'?-1:1));
  ordered.forEach(p=>el('circle',{cx:sx(p.pre),cy:sy(p.post),r:3.6,fill:cbt[p.type],opacity:0.5,stroke:'none'},g));
  for(const v of breakValues){txt(sx(v),plotH+20,v.toString(),{class:'tick','text-anchor':'middle'},g);
    txt(-10,sy(v)+5,v.toString(),{class:'tick','text-anchor':'end'},g);}
  el('line',{x1:0,x2:plotW,y1:plotH,y2:plotH,stroke:COLORS.axis,'stroke-width':1},g);
  el('line',{x1:0,x2:0,y1:0,y2:plotH,stroke:COLORS.axis,'stroke-width':1},g);
  txt(plotW/2,plotH+50,'Books per month, before',{class:'axis-label','text-anchor':'middle'},g);
  txt(-52,plotH/2,'Books per month, after',{class:'axis-label','text-anchor':'middle',transform:`rotate(-90,-52,${plotH/2})`},g);
  const lgSwX=plotW-172,lgY1=plotH-30,lgY2=plotH-10;
  el('circle',{cx:lgSwX,cy:lgY1,r:5,fill:COLORS.aiAssisted,opacity:0.7},g);
  txt(lgSwX+12,lgY1+5,'Observed existing author',{class:'legend'},g);
  el('circle',{cx:lgSwX,cy:lgY2,r:5,fill:COLORS.aiMajority,opacity:0.7},g);
  txt(lgSwX+12,lgY2+5,'Newly observed author',{class:'legend'},g);
}

// ===== PANEL D (stacked rampup; bars ordered by substantial-AI post output) =====
function renderPanelD(){
  const ox=COL[0];
  txt(ox+0,ROW_BOT+36,'D.',{class:'panel-letter'});
  txt(ox+30,ROW_BOT+36,'Top ramp-up authors publish mostly books with substantial',{class:'panel-title'});
  txt(ox+30,ROW_BOT+56,'AI text',{class:'panel-title'});
  txt(ox+30,ROW_BOT+76,'Top 15 ramp-up authors, ordered by substantial-AI post output',{class:'panel-subtitle'});
  //const h=DATA.head.D;
  //txt(ox+30,ROW_BOT+96,`Top 15: ${h.titles} such books (${h.share} of total output)`,{class:'annotation'});
  const plotX=ox+148,plotY=ROW_BOT+138,plotW=250,plotH=400;
  const g=el('g',{transform:`translate(${plotX},${plotY})`});
  const rows=DATA.D.slice().sort((a,b)=>(b.ai-a.ai)||((b.ai+b.other)-(a.ai+a.other))||(a.rank-b.rank));
  const rowH=plotH/rows.length,xMax=35,xS=scale(0,xMax,0,plotW),xTicks=[0,10,20,30];
  for(const t of xTicks){if(t>0)el('line',{x1:xS(t),x2:xS(t),y1:0,y2:plotH,stroke:COLORS.gridline,'stroke-width':1},g);}
  rows.forEach((d,i)=>{const cy=i*rowH+rowH/2,barH=rowH*0.66,yTop=cy-barH/2;
    const aiW=xS(d.ai)-xS(0),otherW=xS(d.other)-xS(0);
    el('rect',{x:0,y:yTop,width:aiW,height:barH,fill:COLORS.aiMajority,stroke:'none'},g);
    el('rect',{x:aiW,y:yTop,width:otherW,height:barH,fill:COLORS.other,stroke:'none'},g);
    txt(aiW+otherW+6,cy+4,d.mix_label,{class:'end-label',fill:COLORS.textMuted},g);
    leftLabel1(-10,cy,d.label,g);});
  el('line',{x1:0,x2:plotW,y1:plotH,y2:plotH,stroke:COLORS.axis,'stroke-width':1},g);
  for(const t of xTicks){el('line',{x1:xS(t),x2:xS(t),y1:plotH,y2:plotH+4,stroke:COLORS.axis,'stroke-width':1},g);
    txt(xS(t),plotH+20,t.toString(),{class:'tick','text-anchor':'middle'},g);}
  txt(plotW/2,plotH+48,'Post-period (12 month) book publish count',{class:'axis-label','text-anchor':'middle'},g);
  const lgY=-22,lgX1=-138,lgX2=56;
  el('rect',{x:lgX1,y:lgY-8,width:14,height:14,fill:COLORS.aiMajority},g);
  txt(lgX1+20,lgY+3,'Substantial-AI post output',{class:'legend'},g);
  el('rect',{x:lgX2,y:lgY-8,width:14,height:14,fill:COLORS.other},g);
  txt(lgX2+20,lgY+3,'Other post output',{class:'legend'},g);
}

// ===== generic single-bar revenue panel (E & F), 2-line left labels =====
function renderRevenuePanel(o){
  const {ox,letter,title,subtitle,rows,xMaxK,xticksK,axisLabel,mkEnd,note}=o;
  txt(ox+0,ROW_BOT+36,letter+'.',{class:'panel-letter'});
  const _tl=Array.isArray(title)?title:[title];
  _tl.forEach((_t,_i)=>txt(ox+30,ROW_BOT+36+_i*20,_t,{class:'panel-title'}));
  const _sy=ROW_BOT+36+_tl.length*20;
  const _sl=Array.isArray(subtitle)?subtitle:[subtitle];
    _sl.forEach((_s,_i)=>txt(ox+30,_sy+_i*18,_s,{class:'panel-subtitle'}));
    if(note)txt(ox+30,_sy+_sl.length*18+2,note,{class:'annotation'});
  const plotX=ox+150,plotY=ROW_BOT+138,plotW=210,plotH=400;
  const g=el('g',{transform:`translate(${plotX},${plotY})`});
  const rowH=plotH/rows.length,xS=scale(0,xMaxK,0,plotW);
  for(const t of xticksK){if(t>0)el('line',{x1:xS(t),x2:xS(t),y1:0,y2:plotH,stroke:COLORS.gridline,'stroke-width':1},g);}
  rows.forEach((d,i)=>{const cy=i*rowH+rowH/2,barH=rowH*0.66,yTop=cy-barH/2;
    const w=xS(d.value/1000)-xS(0);
    el('rect',{x:0,y:yTop,width:w,height:barH,fill:COLORS.revenue,stroke:'none'},g);
    txt(w+6,cy+4,mkEnd(d),{class:'end-label',fill:COLORS.textMuted},g);
    leftLabel1(-10,cy,d.label,g);});
  el('line',{x1:0,x2:plotW,y1:plotH,y2:plotH,stroke:COLORS.axis,'stroke-width':1},g);
  for(const t of xticksK){el('line',{x1:xS(t),x2:xS(t),y1:plotH,y2:plotH+4,stroke:COLORS.axis,'stroke-width':1},g);
    txt(xS(t),plotH+20,t===0?'$0':('$'+t+'K'),{class:'tick','text-anchor':'middle'},g);}
  txt(plotW/2-40,plotH+48,axisLabel,{class:'axis-label','text-anchor':'middle'},g);
}

  const h=DATA.head.E;
