const svg = document.getElementById('figure');
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function txt(x, y, text, attrs = {}, parent = svg) {
  const t = el('text', { x, y, ...attrs }, parent);
  t.textContent = text;
  return t;
}
const scale = (d0, d1, r0, r1) => (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);

// Band display with subscript 'detected' (bands 2 & 3); band 1 plain.
const BAND_DISPLAY = {
  'No detected AI':      [['No AI text',0,1]],
  'AI-detected (0,25%]': [['Light AI text (\u226425%)',0,1]],
  'AI-detected >25%':    [['Substantial AI text (>25%)',0,1]],
};
function bandText(x, y, band, attrs = {}, parent = svg, suffix = '') {
  const t = el('text', { x, y, ...attrs }, parent);
  for (const [s, dy, sz] of BAND_DISPLAY[band]) {
    const ts = document.createElementNS(SVGNS, 'tspan');
    ts.textContent = s;
    if (dy) ts.setAttribute('dy', dy);
    if (sz !== 1) ts.setAttribute('font-size', sz + 'em');
    t.appendChild(ts);
  }
  if (suffix) { const ts = document.createElementNS(SVGNS, 'tspan'); ts.textContent = suffix; t.appendChild(ts); }
  return t;
}

// =============================================================================
// PANEL A: small multiples diffusion (with point-size encoding + facet totals)
// =============================================================================
function renderPanelA() {
  const xOrigin = 20;
  const yOrigin = 30;
  const headerH = 30;

  txt(xOrigin + 30, yOrigin + 18, 'A.', { class: 'panel-letter' });
  txt(xOrigin + 60, yOrigin + 18, 'Books with AI text are diffusing into every genre', { class: 'panel-title' });
  txt(xOrigin + 60, yOrigin + 38, 'Share of new releases with substantial AI text, by genre and quarter', { class: 'axis-label', fill: COLORS.textMuted });

  const gridX = xOrigin + 20;
  const gridY = yOrigin + headerH + 20;
  const cols = 4;
  const rows = 2;
  const panelW = 330;
  const panelH = 200;

  const grouped = {};
  for (const r of DATA.fig1A) {
    if (!grouped[r.cluster]) grouped[r.cluster] = { sort: r.sort_order, total_label: r.total_label, rows: [] };
    grouped[r.cluster].rows.push(r);
  }
  const clusters = Object.entries(grouped)
    .map(([name, v]) => ({
      name, sort: v.sort, total_label: v.total_label,
      rows: v.rows.sort((a, b) => a.quarter.localeCompare(b.quarter))
    }))
    .sort((a, b) => a.sort - b.sort);

  // Volume area scale: rounded up from observed max of 574 to give a clean axis
  const BAR_AXIS_MAX = 600;

  clusters.forEach((c, idx) => {
    const row = Math.floor(idx / cols);
    const col = idx % cols;
    const px = gridX + col * panelW;
    const py = gridY + row * panelH;
    const showY = col === 0;
    const showX = row === rows - 1;

    // Sub-panel layout (in g-local coordinates):
    //   0     : top of line plot
    //   linePlotH (=100)         : bottom of line plot (= 0% gridline)
    //   linePlotH + gapH (=108)  : top of bar strip
    //   barStripBottom (=136)    : bottom of bar strip (= shared x-axis)
    //   barStripBottom + 16 (=152): year tick labels (bottom row only)
    const m = { top: 22, right: 18, left: showY ? 38 : 14 };
    const linePlotH = 100;
    const gapH = 8;
    const barStripH = 28;
    const barStripTop = linePlotH + gapH;
    const barStripBottom = barStripTop + barStripH;
    const innerW = panelW - m.left - m.right - 10;

    // Facet title + total. Total N is right-anchored to the panel's right
    // edge (past the plot area) so it clears even the longest facet title.
    txt(px + m.left, py + 14, `${c.sort}. ${shortLabel(c.name)}`, { class: 'facet-title' });
    txt(px + panelW - 2, py + 14, c.total_label, {
      class: 'facet-total', 'text-anchor': 'end'
    });

    const g = el('g', { transform: `translate(${px + m.left},${py + m.top})` });

    const xS = scale(0, 12, 0, innerW);
    const yS = scale(0, 65, linePlotH, 0);
    const yTicks = [0, 20, 40, 60];
    const xTickIdx = [0, 4, 8, 12];

    // --- LINE PLOT (top sub-panel) ---
    // Gridlines
    for (const t of yTicks) {
      el('line', { x1: 0, x2: innerW, y1: yS(t), y2: yS(t), class: 'grid-line' }, g);
    }
    // Y-axis labels (leftmost column only)
    if (showY) {
      for (const t of yTicks) {
        txt(-6, yS(t) + 4, `${t}%`, { class: 'tick', 'text-anchor': 'end' }, g);
      }
    }
    // Overall market reference line
    const overallPath = c.rows.map((r, i) => `${i === 0 ? 'M' : 'L'} ${xS(i)} ${yS(r.overall)}`).join(' ');
    el('path', { d: overallPath, fill: 'none', stroke: COLORS.reference, 'stroke-width': 1.4, 'stroke-dasharray': '3,2' }, g);
    // Cluster line
    const sharePath = c.rows.map((r, i) => `${i === 0 ? 'M' : 'L'} ${xS(i)} ${yS(r.share)}`).join(' ');
    el('path', { d: sharePath, fill: 'none', stroke: COLORS.aiMajority, 'stroke-width': 2 }, g);
    // Uniform small dots on the share line
    c.rows.forEach((r, i) => {
      el('circle', {
        cx: xS(i), cy: yS(r.share),
        r: 2.2,
        fill: COLORS.aiMajority,
        stroke: COLORS.aiMajority,
        'stroke-width': 1
      }, g);
    });
    // Line-plot baseline at 0%
    el('line', { x1: 0, x2: innerW, y1: linePlotH, y2: linePlotH, class: 'axis-line' }, g);

    // --- VOLUME AREA (bottom sub-panel, separate scale) ---
    const areaTopPoints = c.rows.map((r, i) => {
      const barH = (r.n / BAR_AXIS_MAX) * barStripH;
      return [xS(i), barStripBottom - barH];
    });
    // Closed polygon for fill (top edge + right side down to baseline + back along baseline)
    const polygonPoints = [
      ...areaTopPoints.map(([x, y]) => `${x},${y}`),
      `${xS(12)},${barStripBottom}`,
      `${xS(0)},${barStripBottom}`
    ].join(' ');
    el('polygon', {
      points: polygonPoints,
      fill: '#dcdcdc',
      stroke: 'none'
    }, g);
    // Top-edge stroke (darker, traces the n_titles curve)
    const topEdgePath = areaTopPoints
      .map(([x, y], i) => `${i === 0 ? 'M' : 'L'} ${x} ${y}`)
      .join(' ');
    el('path', {
      d: topEdgePath, fill: 'none', stroke: '#888888', 'stroke-width': 1
    }, g);
    // Volume-area y-axis labels: 0 at baseline, scale max at top (leftmost column only)
    if (showY) {
      txt(-6, barStripTop + 9, String(BAR_AXIS_MAX), {
        class: 'tick', 'text-anchor': 'end', fill: COLORS.textMuted, 'font-size': 10
      }, g);
      txt(-6, barStripBottom + 1, '0', {
        class: 'tick', 'text-anchor': 'end', fill: COLORS.textMuted, 'font-size': 10
      }, g);
    }
    // Bar-strip baseline (shared x-axis)
    el('line', { x1: 0, x2: innerW, y1: barStripBottom, y2: barStripBottom, class: 'axis-line' }, g);

    // --- SHARED X-AXIS LABELS (shown on every panel for direct readability) ---
    for (const i of xTickIdx) {
      el('line', { x1: xS(i), x2: xS(i), y1: barStripBottom, y2: barStripBottom + 3, class: 'axis-line' }, g);
      const yearLabel = c.rows[i].quarter.split(' ')[0];
      txt(xS(i), barStripBottom + 14, yearLabel, { class: 'tick', 'text-anchor': 'middle' }, g);
    }
  });

  // Legend: three items (line, dashed reference, faint bars)
  const legY = gridY + rows * panelH + 8;
  const legX = gridX + 20;

  el('line', { x1: legX, x2: legX + 24, y1: legY, y2: legY, stroke: COLORS.aiMajority, 'stroke-width': 2 });
  el('circle', { cx: legX + 12, cy: legY, r: 2.2, fill: COLORS.aiMajority, stroke: COLORS.aiMajority, 'stroke-width': 1 });
  bandText(legX + 30, legY + 4, 'AI-detected >25%', { class: 'legend' }, svg);

  el('line', { x1: legX + 215, x2: legX + 239, y1: legY, y2: legY, stroke: COLORS.reference, 'stroke-width': 1.4, 'stroke-dasharray': '3,2' });
  txt(legX + 245, legY + 4, 'Average across all genres', { class: 'legend' });

  el('rect', { x: legX + 555, y: legY - 6, width: 14, height: 12, fill: '#dcdcdc' });
  el('line', { x1: legX + 555, x2: legX + 569, y1: legY - 6, y2: legY - 6, stroke: '#888888', 'stroke-width': 1 });
  txt(legX + 575, legY + 4, 'Quarterly new releases (common scale, max = ' + BAR_AXIS_MAX + ')', { class: 'legend' });
}

// =============================================================================
// PANEL B: continuous upper-tail representation curve
// =============================================================================
function renderPanelB() {
  const xOrigin = 20;
  const yOrigin = 530;
  const headerH = 30;

  txt(xOrigin + 30, yOrigin + 18, 'B.', { class: 'panel-letter' });
  txt(xOrigin + 60, yOrigin + 18, 'Most top-selling books have no AI text', { class: 'panel-title' });
  txt(xOrigin + 60, yOrigin + 40, 'Composition of each sales-rank tier by AI-text band (launch window)',
      { class: 'axis-label', fill: COLORS.textMuted });

  const groups = ['No detected AI', 'AI-detected (0,25%]', 'AI-detected >25%'];

  // Plot geometry. Bars are horizontal; one row per tier.
  const plotX = xOrigin + 130;          // left edge of bars (room for tier labels)
  const plotY = yOrigin + headerH + 40; // top of first bar
  const plotW = 470;                    // 0-100% width
  const barH = 40;
  const rowGap = 22;
  const baseGap = 16;                   // extra gap under the "All titles" anchor

  const xS = scale(0, 1, 0, plotW);

  // Compute a y-position for each tier row, inserting a divider after the base row.
  let y = 0;
  const rows = FIG1B_TIERS.map((t, i) => {
    const top = y;
    y += barH + rowGap + (t.isBase ? baseGap : 0);
    return { ...t, top };
  });
  const plotBottom = rows[rows.length - 1].top + barH;

  const g = el('g', { transform: `translate(${plotX},${plotY})` });

  // Vertical gridlines at 0/25/50/75/100 behind the bars
  const xTicks = [0, 0.25, 0.50, 0.75, 1.0];
  for (const t of xTicks) {
    el('line', { x1: xS(t), x2: xS(t), y1: -4, y2: plotBottom + 4, class: 'grid-line' }, g);
  }

  // Divider line separating the "All titles" baseline from the tiers
  const baseRow = rows.find(r => r.isBase);
  if (baseRow) {
    const dy = baseRow.top + barH + (baseGap + rowGap) / 2;
    el('line', { x1: -120, x2: plotW, y1: dy, y2: dy,
                 stroke: '#d8d8d8', 'stroke-width': 1 }, g);
  }

  // Draw each tier row: stacked segments, inside % labels, tier label, n label.
  rows.forEach(row => {
    const cy = row.top + barH / 2;

    // Tier label (left)
    txt(-16, cy + 5, row.tier, {
      class: 'axis-label', 'text-anchor': 'end',
      'font-weight': row.isBase ? 700 : 400
    }, g);

    // Stacked segments
    let cum = 0;
    row.parts.forEach(p => {
      const x0 = xS(cum);
      const x1 = xS(cum + p.share);
      const w = x1 - x0;
      el('rect', { x: x0, y: row.top, width: w, height: barH,
                   fill: GROUP_COLOR[p.group] }, g);
      // Inside percentage label, only if the segment is wide enough.
      // For too-narrow AI-Majority segments, place the label just above
      // the bar's right end in the group color so the shrink stays legible.
      if (w > 26) {
        txt((x0 + x1) / 2, cy + 5, p.pctLabel, {
          'text-anchor': 'middle', fill: '#ffffff',
          'font-size': 14, 'font-weight': 700
        }, g);
      } else if (p.group === 'AI-detected >25%') {
        txt(x1 - 2, row.top - 5, p.pctLabel, {
          'text-anchor': 'end', fill: GROUP_COLOR['AI-detected >25%'],
          'font-size': 13, 'font-weight': 700
        }, g);
      }
      cum += p.share;
    });

    // n label (right of bar)
    txt(plotW + 12, cy + 5, row.nLabel, {
      class: 'tick', 'text-anchor': 'start', fill: COLORS.textMuted
    }, g);
  });

  // X-axis baseline, ticks, labels
  el('line', { x1: 0, x2: plotW, y1: plotBottom + 4, y2: plotBottom + 4, class: 'axis-line' }, g);
  xTicks.forEach(t => {
    el('line', { x1: xS(t), x2: xS(t), y1: plotBottom + 4, y2: plotBottom + 8, class: 'axis-line' }, g);
    txt(xS(t), plotBottom + 24, Math.round(t * 100) + '%', { class: 'tick', 'text-anchor': 'middle' }, g);
  });
  txt(plotW / 2, plotBottom + 46, 'Share of titles within tier', {
    class: 'axis-label', 'text-anchor': 'middle'
  }, g);

  // Legend (centered under the plot)
  const legY = plotBottom + 74;
  const legItems = [
    { group: 'No detected AI', label: 'No AI text' },
    { group: 'AI-detected (0,25%]', label: 'Light AI text (<=25%)' },
    { group: 'AI-detected >25%', label: 'Substantial AI text (>25%)' },
  ];
  const sw = 16, txtGap = 7, itemGap = 22, charPx = 7.4;
  const widths = legItems.map(it => sw + txtGap + it.label.length * charPx);
  const totalW = widths.reduce((a, b) => a + b, 0) + (legItems.length - 1) * itemGap;
  let lx = plotW / 2 - totalW / 2;
  legItems.forEach((it, i) => {
    el('rect', { x: lx, y: legY - 12, width: sw, height: sw, fill: GROUP_COLOR[it.group] }, g);
    bandText(lx + sw + txtGap, legY + 1, it.group, { class: 'legend' }, g);
    lx += widths[i] + itemGap;
  });
}

// =============================================================================
// PANEL C: slopegraph (unchanged structure; colors updated to orange/blue)
// =============================================================================
function renderPanelC() {
  const xOrigin = 740;
  const yOrigin = 530;
  const headerH = 30;

  txt(xOrigin + 30, yOrigin + 18, 'C.', { class: 'panel-letter' });
  txt(xOrigin + 60, yOrigin + 18, 'Books with AI text capture more of the catalog than of sales', { class: 'panel-title' });
  txt(xOrigin + 60, yOrigin + 40, 'Share of books, sales, and revenue by AI-text band (launch window)',
      { class: 'axis-label', fill: COLORS.textMuted });

  const plotX = xOrigin + 90;
  const plotY = yOrigin + headerH + 40;
  const plotW = 480;
  const plotH = 320;

  const g = el('g', { transform: `translate(${plotX},${plotY})` });

  const metrics = ['Title share', 'Sales share', 'Revenue share'];
  const groups = ['No detected AI', 'AI-detected (0,25%]', 'AI-detected >25%'];
  const xS = scale(0, metrics.length - 1, 0, plotW);
  const yS = scale(0, 80, plotH, 0);
  const yTicks = [0, 20, 40, 60, 80];

  for (const t of yTicks) {
    el('line', { x1: 0, x2: plotW, y1: yS(t), y2: yS(t), class: 'grid-line' }, g);
  }
  metrics.forEach((m, i) => {
    el('line', {
      x1: xS(i), x2: xS(i), y1: 0, y2: plotH,
      stroke: '#d8d8d8', 'stroke-width': 1, 'stroke-dasharray': '2,3'
    }, g);
  });

  const byGroup = {};
  for (const gr of groups) {
    byGroup[gr] = metrics.map(m => DATA.fig1C.find(d => d.group === gr && d.metric === m));
  }

  for (const gr of groups) {
    const pts = byGroup[gr];
    const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xS(i)} ${yS(p.share_pct)}`).join(' ');
    el('path', { d: path, fill: 'none', stroke: GROUP_COLOR[gr], 'stroke-width': 2.4 }, g);
  }

  // Group names sit at the LEFT end, on top of each line, replacing the
  // right-side labels to save horizontal space. AI-Majority goes just below
  // its line (it is the lowest), the other two just above theirs.
  const HEAVY = 'AI-detected >25%';
  for (const gr of groups) {
    const pts = byGroup[gr];
    pts.forEach((p, i) => {
      el('circle', {
        cx: xS(i), cy: yS(p.share_pct), r: 4.2,
        fill: GROUP_COLOR[gr], stroke: '#fff', 'stroke-width': 1.5
      }, g);
      const anchor = i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle');
      let dy = (gr === HEAVY) ? 16 : -9;            // heavy band labels below its line
      // At the Title-share point, the heavy (20.0%) and light (17.1%) values
      // nearly coincide, so the default rule collides them. Flip: push the
      // heavy label above its line and the light label below, to separate them.
      if (i === 0 && gr === HEAVY) dy = -9;
      if (i === 0 && gr === 'AI-detected (0,25%]') dy = 16;
      txt(xS(i), yS(p.share_pct) + dy, p.label, {
        class: 'tick', fill: GROUP_COLOR[gr], 'font-weight': 600,
        'font-size': 12, 'text-anchor': anchor
      }, g);
    });
  }

  // Band legend (no box), in the open middle band between the no-AI line and the AI bands
  const legX = 8, legY0 = 116, legRowH = 26, legLine = 24;
  groups.forEach((gr, i) => {
    const ry = legY0 + i * legRowH;
    el('line', { x1: legX, x2: legX + legLine, y1: ry, y2: ry, stroke: GROUP_COLOR[gr], 'stroke-width': 2.6, 'stroke-linecap': 'round' }, g);
    el('circle', { cx: legX + legLine / 2, cy: ry, r: 4.2, fill: GROUP_COLOR[gr], stroke: '#fff', 'stroke-width': 1.5 }, g);
    bandText(legX + legLine + 8, ry + 4, gr, { class: 'legend', fill: GROUP_COLOR[gr], 'font-weight': 600, 'text-anchor': 'start' }, g);
  });

  el('line', { x1: 0, x2: plotW, y1: plotH, y2: plotH, class: 'axis-line' }, g);
  metrics.forEach((m, i) => {
    txt(xS(i), plotH + 22, m, {
      class: 'axis-label', 'text-anchor': 'middle', 'font-weight': 500
    }, g);
  });

  for (const t of yTicks) {
    txt(-8, yS(t) + 4, `${t}%`, { class: 'tick', 'text-anchor': 'end' }, g);
  }
  txt(-60, plotH / 2, 'Share of total (%)', {
    class: 'axis-label', 'text-anchor': 'middle',
    transform: `rotate(-90, -60, ${plotH / 2})`
  }, g);
}

renderPanelA();
renderPanelB();
renderPanelC();
